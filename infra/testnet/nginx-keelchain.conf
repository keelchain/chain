# Keelchain origin config, behind Cloudflare (proxied DNS,
# TLS "Full (strict)" with a Cloudflare Origin CA certificate on the origin).
#
# DNS (Cloudflare, proxied):  keelchain.com  A <box ip>
#                             www            CNAME keelchain.com
#                             testnet        A <box ip>
# Origin cert: Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create
# certificate for keelchain.com, *.keelchain.com; install as
# /etc/ssl/keelchain/origin.pem + origin.key (0600).

server {
    listen 443 ssl http2;
    server_name keelchain.com www.keelchain.com;
    ssl_certificate     /etc/ssl/keelchain/origin.pem;
    ssl_certificate_key /etc/ssl/keelchain/origin.key;
    root /var/www/keelchain/site;            # site/ from the keel repo
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}

# API keys for action submission: /etc/keelchain/api-keys.map holds
# `"<bearer token>" "<label>";` lines rendered by the deploy from the
# KEEL_API_KEYS secret (root-only on the box). Anonymous reads stay open,
# rate-limited; posting an action needs `Authorization: Bearer <key>` when
# the map is non-empty. conf.d/keel-api-keys.conf maps the token to its label.
map $http_authorization $keel_bearer {
    default "";
    "~^Bearer (?<k>.+)$" $k;
}
limit_req_zone $binary_remote_addr zone=keel_actions:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=keel_reads:10m rate=60r/s;

server {
    listen 443 ssl http2;
    server_name testnet.keelchain.com;
    ssl_certificate     /etc/ssl/keelchain/origin.pem;
    ssl_certificate_key /etc/ssl/keelchain/origin.key;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Action submission: rate-limited per address and, when keys are
    # configured, gated by the key map (see /etc/keelchain/api-keys.conf).
    location = /rpc/v1/actions {
        limit_req zone=keel_actions burst=20 nodelay;
        include /etc/keelchain/api-keys.conf;
        proxy_pass http://127.0.0.1:5100/v1/actions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    # node RPC (keel-node, loopback 5100) and indexer (keel-indexer, loopback 6100)
    location /rpc/ {
        limit_req zone=keel_reads burst=120 nodelay;
        # CORS headers come from the upstream itself (keel-node / keel-indexer).
        proxy_pass http://127.0.0.1:5100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
    # Faucet claims: a few per address per minute is plenty.
    location = /api/v1/faucet {
        limit_req zone=keel_actions burst=5 nodelay;
        proxy_pass http://127.0.0.1:6100/v1/faucet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        limit_req zone=keel_reads burst=120 nodelay;
        # CORS headers come from the upstream itself (keel-node / keel-indexer).
        proxy_pass http://127.0.0.1:6100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
    # explorer (apps/explorer built with VITE_BASE=/ and
    # VITE_NETWORKS='[{"id":"testnet","name":"Keel testnet","api":"https://testnet.keelchain.com/api"}]')
    root /var/www/keelchain/explorer;
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate" always; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name keelchain.com www.keelchain.com testnet.keelchain.com;
    return 301 https://$host$request_uri;
}
