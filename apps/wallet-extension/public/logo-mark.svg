<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Keel">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2F5B"/><stop offset="1" stop-color="#081C36"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sea)"/>
  <!-- hull: two flanks meeting at the keel -->
