name: Deploy testnet

# Builds the node binaries, the explorer, the site, the docs pages and the
# wallet packages, builds the genesis from every host's public identity, then
# installs everything on each testnet host over SSH. Secrets and settings
# come from the `testnet` GitHub environment (infra/testnet/README.md lists
# them); nothing is edited on a box by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_chain:
        description: Wipe chain state on every host and start a new chain from the release genesis
        type: boolean
        default: false
      environment:
        description: GitHub environment to deploy (testnet, or testnet-staging for the staging box)
        type: string
        default: testnet

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'testnet' }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-24.04   # glibc matches the Ubuntu 24.04 boxes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chain
      - run: sudo apt-get update && sudo apt-get install -y m4
      - name: Build
        working-directory: chain
        run: cargo build --release --locked -p keel-node -p keel-indexer -p keel-observer -p keel-cli -p keel-tss
      - uses: actions/upload-artifact@v4
        with:
          name: keel-bin
          path: |
            chain/target/release/keel-node
            chain/target/release/keel-indexer
            chain/target/release/keel-observer
            chain/target/release/keel
            chain/target/release/keel-tss
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK
        working-directory: sdk/ts
        run: npm ci && npm run build
      - name: Explorer
        working-directory: apps/explorer
        env:
          VITE_BASE: /
          VITE_NETWORKS: ${{ vars.EXPLORER_NETWORKS || '[{"id":"testnet","name":"Keel testnet","api":"https://testnet.keelchain.com/api"}]' }}
        run: npm ci && npm run build
      - name: Wallet packages
        working-directory: apps/wallet-extension
        run: npm ci && npm run package
      - name: Example client (wallet/try)
        working-directory: apps/example-client
        env:
          VITE_BASE: /wallet/try/
        run: npm ci && npm run build
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/site/wallet/downloads out/site/wallet/try
          cp -r site/. out/site/
          cp apps/wallet-extension/dist-store/*.zip out/site/wallet/downloads/
          cp -r apps/example-client/dist/. out/site/wallet/try/
          cp -r apps/explorer/dist out/explorer
          # The signed Firefox build and its update manifest come from the
          # newest `wallet-v*` release made by publish-wallet.yml, when any.
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("wallet-v"))][0].tagName' 2>/dev/null || true)
          if [ -n "$TAG" ] && [ "$TAG" != null ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out/site/wallet/downloads --pattern '*.xpi' --pattern 'updates.json' || true
            ls out/site/wallet/downloads
          fi
      - name: Render docs pages
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          infra/dev/render-docs.sh out/site/docs
          rm -f out/site/docs/template.html
      - uses: actions/upload-artifact@v4
        with:
          name: keel-web
          path: out
          if-no-files-found: error

  # Every host's public identity (consensus key + account) from its seed, and
  # the genesis built from those keys. Deterministic: the same inputs give
  # the same file, which is how a non-reset deploy checks nothing changed.
  genesis:
    needs: [binaries]
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.environment || 'testnet' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keel-bin
          path: bin
      - name: Resolve hosts
        # The multi-host layout (DEPLOY_HOSTS, KEEL_VALIDATOR_SEED_<i>). A
        # single box configured the old way (DEPLOY_HOST, DEPLOY_USER,
        # KEEL_VALIDATOR_SEED) still works as host 0.
        env:
          DEPLOY_HOSTS: ${{ vars.DEPLOY_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          if [ -n "$DEPLOY_HOSTS" ]; then
            python3 -c 'import json,os; h=json.loads(os.environ["DEPLOY_HOSTS"]); assert isinstance(h, list) and h and all("ip" in x for x in h)' \
              || { echo "::error::DEPLOY_HOSTS must be a JSON list of {\"ip\",\"user\",\"wg_ip\"} (infra/testnet/README.md)"; exit 1; }
            echo "HOSTS_JSON=$DEPLOY_HOSTS" >> "$GITHUB_ENV"
          elif [ -n "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOSTS is not set; using the single host DEPLOY_HOST as host 0"
            echo "HOSTS_JSON=[{\"ip\":\"$DEPLOY_HOST\",\"user\":\"${DEPLOY_USER:-ubuntu}\"}]" >> "$GITHUB_ENV"
          else
            echo "::error::set the DEPLOY_HOSTS variable in the '${{ github.event.inputs.environment || 'testnet' }}' environment (infra/testnet/README.md)"; exit 1
          fi
      - name: Identities and genesis
        env:
          KEEL_VALIDATOR_SEED_0: ${{ secrets.KEEL_VALIDATOR_SEED_0 || secrets.KEEL_VALIDATOR_SEED }}
          KEEL_VALIDATOR_SEED_1: ${{ secrets.KEEL_VALIDATOR_SEED_1 }}
          KEEL_VALIDATOR_SEED_2: ${{ secrets.KEEL_VALIDATOR_SEED_2 }}
          KEEL_CHAIN_ID: ${{ vars.KEEL_CHAIN_ID || '3' }}
          KEEL_OBSERVER_THRESHOLD: ${{ vars.KEEL_OBSERVER_THRESHOLD }}
          KEEL_PARAM_ADMIN: ${{ vars.KEEL_PARAM_ADMIN }}
          KEEL_ATTESTER: ${{ vars.KEEL_ATTESTER }}
          KEEL_ARBITRATOR: ${{ vars.KEEL_ARBITRATOR }}
          KEEL_GENESIS_FUNDS: ${{ vars.KEEL_GENESIS_FUNDS }}
          KEEL_VALIDATOR_BOND: ${{ vars.KEEL_VALIDATOR_BOND || '100000000000' }}
        run: |
          chmod +x bin/*
          umask 077
          mkdir -p release
          NHOSTS=$(python3 -c 'import json,os; print(len(json.loads(os.environ["HOSTS_JSON"])))')
          : > release/identities.json
          IDS="["
          ARGS=""
          for i in $(seq 0 $((NHOSTS-1))); do
            SEED_VAR="KEEL_VALIDATOR_SEED_$i"; SEED="${!SEED_VAR}"
            [ -n "$SEED" ] || { echo "::error::secret $SEED_VAR is missing (one decimal u64 per host, infra/testnet/README.md)"; exit 1; }
            case "$SEED" in *[!0-9]*) echo "::error::secret $SEED_VAR must be a decimal u64"; exit 1;; esac
            ID=$(bin/keel-node --print-identity --me "$SEED@0" --storage-dir /tmp/keel-id-$i 2>/tmp/keel-id-$i.err) || { echo "::error::keel-node --print-identity failed for host $i"; cat /tmp/keel-id-$i.err; exit 1; }
            echo "$ID" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo "::error::unexpected identity output for host $i"; echo "$ID"; cat /tmp/keel-id-$i.err; exit 1; }
            CK=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["consensus_key"])' "$ID")
            AD=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["address"])' "$ID")
            [ "$i" = 0 ] || IDS="$IDS,"
            IDS="$IDS{\"index\":$i,\"consensus_key\":\"$CK\",\"address\":\"$AD\"}"
            ARGS="$ARGS --validator $CK:$AD:$KEEL_VALIDATOR_BOND --observer $AD"
            # every validator account holds an operating float; host 0 also KUSD for onboarding
            ARGS="$ARGS --fund $AD:KEEL:1000000000000"
            [ "$i" = 0 ] && ARGS="$ARGS --fund $AD:KUSD:1000000000000"
          done
          IDS="$IDS]"
          echo "$IDS" > release/identities.json
          HOST0=$(python3 -c 'import json; print(json.load(open("release/identities.json"))[0]["address"])')
          [ -n "$KEEL_OBSERVER_THRESHOLD" ] && ARGS="$ARGS --observer-threshold $KEEL_OBSERVER_THRESHOLD"
          ARGS="$ARGS --param-admin ${KEEL_PARAM_ADMIN:-$HOST0} --attester ${KEEL_ATTESTER:-$HOST0} --arbitrator ${KEEL_ARBITRATOR:-$HOST0}"
          for f in $(echo "${KEEL_GENESIS_FUNDS:-}" | tr ',' ' '); do ARGS="$ARGS --fund $f"; done
          # shellcheck disable=SC2086
          bin/keel --chain-id "$KEEL_CHAIN_ID" genesis-build $ARGS --params-json infra/testnet/genesis-params.json --out release/genesis.json
          cat release/identities.json
      - uses: actions/upload-artifact@v4
        with:
          name: keel-genesis
          path: release
          if-no-files-found: error

  deploy:
    needs: [binaries, web, genesis]
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.environment || 'testnet' }}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        host: ${{ fromJSON(vars.DEPLOY_HOST_INDEXES || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keel-bin
          path: release/bin
      - uses: actions/download-artifact@v4
        with:
          name: keel-web
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: keel-genesis
          path: release
      - name: Resolve hosts
        # The multi-host layout (DEPLOY_HOSTS, KEEL_VALIDATOR_SEED_<i>). A
        # single box configured the old way (DEPLOY_HOST, DEPLOY_USER,
        # KEEL_VALIDATOR_SEED) still works as host 0.
        env:
          DEPLOY_HOSTS: ${{ vars.DEPLOY_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          if [ -n "$DEPLOY_HOSTS" ]; then
            python3 -c 'import json,os; h=json.loads(os.environ["DEPLOY_HOSTS"]); assert isinstance(h, list) and h and all("ip" in x for x in h)' \
              || { echo "::error::DEPLOY_HOSTS must be a JSON list of {\"ip\",\"user\",\"wg_ip\"} (infra/testnet/README.md)"; exit 1; }
            echo "HOSTS_JSON=$DEPLOY_HOSTS" >> "$GITHUB_ENV"
          elif [ -n "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOSTS is not set; using the single host DEPLOY_HOST as host 0"
            echo "HOSTS_JSON=[{\"ip\":\"$DEPLOY_HOST\",\"user\":\"${DEPLOY_USER:-ubuntu}\"}]" >> "$GITHUB_ENV"
          else
            echo "::error::set the DEPLOY_HOSTS variable in the '${{ github.event.inputs.environment || 'testnet' }}' environment (infra/testnet/README.md)"; exit 1
          fi
      - name: Stage release
        env:
          HOST_INDEX: ${{ matrix.host }}
          KEEL_VALIDATOR_SEED: ${{ secrets[format('KEEL_VALIDATOR_SEED_{0}', matrix.host)] || secrets.KEEL_VALIDATOR_SEED }}
          WG_PRIVATE_KEY: ${{ secrets[format('WG_PRIVATE_KEY_{0}', matrix.host)] }}
          WG_PUBKEYS: ${{ vars.WG_PUBKEYS }}
          KEEL_TSS_PASSPHRASE: ${{ secrets.KEEL_TSS_PASSPHRASE }}
          KEEL_TSS_SECRET: ${{ secrets.KEEL_TSS_SECRET }}
          KEEL_API_KEYS: ${{ secrets.KEEL_API_KEYS }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          KEEL_CLIENTS: ${{ vars.KEEL_CLIENTS }}
          KEEL_MONITORING: ${{ vars.KEEL_MONITORING }}
          ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST }}
          ALERT_SMTP_FROM: ${{ vars.ALERT_SMTP_FROM }}
          ALERT_SMTP_USER: ${{ vars.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          KEEL_SIGNER_MODE: ${{ vars.KEEL_SIGNER_MODE || 'tss' }}
          KEEL_SIGNER_SEED: ${{ secrets.KEEL_SIGNER_SEED }}
          KEEL_OBSERVER_THRESHOLD: ${{ vars.KEEL_OBSERVER_THRESHOLD }}
          INDEXER_DATABASE_URL: ${{ secrets.INDEXER_DATABASE_URL }}
          BITCOIN_RPC_PASSWORD: ${{ secrets.BITCOIN_RPC_PASSWORD }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          KEEL_CHAIN_ID: ${{ vars.KEEL_CHAIN_ID }}
          KEEL_EXTERNAL_NETWORK: ${{ vars.KEEL_EXTERNAL_NETWORK }}
          KEEL_NODE_EXTRA_ARGS: ${{ vars.KEEL_NODE_EXTRA_ARGS }}
          BITCOIN_RPC_URL: ${{ vars.BITCOIN_RPC_URL }}
          BITCOIN_RPC_USER: ${{ vars.BITCOIN_RPC_USER }}
          BITCOIN_WALLET: ${{ vars.BITCOIN_WALLET }}
          INDEXER_PG_CONTAINER: ${{ vars.INDEXER_PG_CONTAINER }}
          TRON_API_URL: ${{ vars.TRON_API_URL }}
          TRON_USDT_CONTRACT: ${{ vars.TRON_USDT_CONTRACT }}
          # The manual run's checkbox, or the KEEL_RESET_CHAIN variable set to
          # 'true' for one run (remove it afterwards: every later deploy would
          # wipe the chain again).
          RESET_CHAIN: ${{ (inputs.reset_chain == true || github.event.inputs.reset_chain == 'true' || vars.KEEL_RESET_CHAIN == 'true') && 'true' || 'false' }}
          TRIGGER: ${{ github.event_name }}
        run: |
          echo "trigger=$TRIGGER reset_chain=$RESET_CHAIN"
          cp -r infra release/infra
          chmod +x release/bin/*
          umask 077
          # shell-quoted so values with spaces or JSON survive `source`
          for k in HOST_INDEX HOSTS_JSON KEEL_VALIDATOR_SEED WG_PRIVATE_KEY WG_PUBKEYS KEEL_TSS_PASSPHRASE KEEL_TSS_SECRET KEEL_API_KEYS \
                   RCLONE_CONF AGE_RECIPIENT KEEL_CLIENTS KEEL_MONITORING ALERT_SMTP_HOST ALERT_SMTP_FROM ALERT_SMTP_USER ALERT_SMTP_PASSWORD ALERT_TO GRAFANA_PASSWORD \
                   KEEL_SIGNER_MODE KEEL_SIGNER_SEED KEEL_OBSERVER_THRESHOLD INDEXER_DATABASE_URL BITCOIN_RPC_PASSWORD TRONGRID_API_KEY \
                   KEEL_CHAIN_ID KEEL_EXTERNAL_NETWORK KEEL_NODE_EXTRA_ARGS BITCOIN_RPC_URL BITCOIN_RPC_USER \
                   BITCOIN_WALLET INDEXER_PG_CONTAINER TRON_API_URL TRON_USDT_CONTRACT RESET_CHAIN; do
            printf '%s=%q\n' "$k" "${!k}"
          done > release/deploy.env
          tar czf release.tgz -C release .
      - name: SSH key
        env:
          HOST_INDEX: ${{ matrix.host }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          IP=$(python3 -c 'import json,os; print(json.loads(os.environ["HOSTS_JSON"])[int(os.environ["HOST_INDEX"])]["ip"])')
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -H "$IP" > ~/.ssh/known_hosts 2>/dev/null; fi
      - name: Upload and run
        env:
          HOST_INDEX: ${{ matrix.host }}
        run: |
          H=$(python3 -c 'import json,os; h=json.loads(os.environ["HOSTS_JSON"])[int(os.environ["HOST_INDEX"])]; print(h.get("user","ubuntu")+"@"+h["ip"])')
          ssh -i ~/.ssh/id_deploy "$H" 'rm -rf ~/keel-deploy && mkdir -m 700 ~/keel-deploy'
          scp -i ~/.ssh/id_deploy release.tgz "$H":~/keel-deploy/release.tgz
          ssh -i ~/.ssh/id_deploy "$H" 'cd ~/keel-deploy && tar xzf release.tgz && rm release.tgz && bash infra/testnet/deploy-remote.sh'

  checks:
    needs: [deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Public checks
        run: |
          curl -sf https://testnet.keelchain.com/rpc/v1/status | head -c 300; echo
          curl -sf https://testnet.keelchain.com/api/v1/health | head -c 300; echo
          curl -sfo /dev/null -w 'site %{http_code}\n' https://keelchain.com/
          curl -sfo /dev/null -w 'docs %{http_code}\n' https://keelchain.com/docs/
