[package]
name = "keel-tss"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Threshold signer for the KEEL vaults: CGGMP21 ECDSA (secp256k1, HD) and FROST Ed25519."

[[bin]]
name = "keel-tss"
path = "src/main.rs"

[dependencies]
keel-types.workspace = true
keel-crypto.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
hex.workspace = true
sha2.workspace = true
axum = "0.8"
# cggmp21 0.6 pins generic-ec 0.4 / key-share 0.6 / round-based 0.4; the
# versions here must match or the types will not line up.
cggmp21 = { version = "0.6", features = ["curve-secp256k1", "hd-wallet", "hd-slip10", "state-machine"] }
generic-ec = { version = "0.4", features = ["curve-secp256k1", "serde"] }
key-share = { version = "0.6", features = ["serde", "hd-wallet"] }
round-based = { version = "0.4", features = ["derive", "state-machine"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
chacha20poly1305 = "0.10"
hmac = "0.12"
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }

[dev-dependencies]
keel-chains.workspace = true
keel-actions.workspace = true
ed25519-dalek.workspace = true

[features]
default = []

[lints]
workspace = true
