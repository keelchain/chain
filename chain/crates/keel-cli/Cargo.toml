[package]
name = "keel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line client for the Keelchain: keys, signing, submitting, queries."

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
keel-types.workspace = true
keel-crypto.workspace = true
keel-actions.workspace = true
keel-vm.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
anyhow.workspace = true
ureq = { version = "3", features = ["json"] }
getrandom = "0.3"

[lints]
workspace = true
