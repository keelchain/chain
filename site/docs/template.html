<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title$ · Keelchain docs</title>
<meta name="description" content="$if(description)$$description$$else$Keelchain documentation: $title$$endif$">
<link rel="icon" href="$root$keel-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="$root$keel.css">
<style>
  .doc { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
  .doc h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: .3em; }
  .doc h2 { font-size: 1.45rem; margin-top: 2.2em; padding-top: .6em; border-top: 1px solid var(--line); }
  .doc h3 { font-size: 1.1rem; margin-top: 1.6em; }
  .doc p, .doc li { color: var(--ink); }
  .doc pre { margin: 14px 0; }
  .doc table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: .92rem; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--card); color: var(--muted); font-weight: 600; }
  .doc blockquote { margin: 14px 0; padding: 4px 18px; border-left: 3px solid var(--teal-dim); color: var(--muted); }
  .doc .crumbs { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
  .doc nav.toc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 18px 0 28px; font-size: .92rem; }
  .doc nav.toc ul { margin: 0; padding-left: 18px; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="$root$"><img src="$root$keel-logo-dark.svg" alt="Keelchain"></a>
  <nav>
    <a href="$root$docs/">Docs</a>
    <a href="$root$wallet/">Wallet</a>
    <a href="https://testnet.keelchain.com/" class="hide-sm">Explorer</a>
    <a href="https://github.com/keelchain/chain" class="hide-sm">Source</a>
  </nav>
</div></header>

<main class="doc">
  <div class="crumbs"><a href="$root$docs/">Docs</a> / $title$</div>
$if(toc)$
  <nav class="toc">$table-of-contents$</nav>
$endif$
$body$
</main>

<footer><div class="wrap">
  <div><img src="$root$keel-logo-dark.svg" alt="Keelchain" style="height:26px;margin-bottom:12px"><p>Rendered from <code>$source$</code> in the public repository.</p></div>
  <div><h4>Keelchain</h4><ul><li><a href="$root$">Home</a></li><li><a href="https://testnet.keelchain.com/">Explorer</a></li><li><a href="$root$docs/">All docs</a></li></ul></div>
  <div><h4>Contact</h4><ul><li><a href="mailto:mohab@keelchain.com">mohab@keelchain.com</a> — partnerships, API access, roles</li><li><a href="mailto:support@keelchain.com">support@keelchain.com</a></li></ul></div>
</div></footer>
</body>
</html>
